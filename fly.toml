app = "bitwave"
primary_region = "bom"

[env]
  RENDER_DISK_MOUNT_PATH = "/app/storage"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[mounts]]
  source = "bitwave_storage"
  destination = "/app/storage"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 1024
  processes = ["worker"]

[processes]
  app = "gunicorn --worker-class eventlet -w 1 --bind 0.0.0.0:8080 app:app"
  worker = "python worker.py"
