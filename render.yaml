services:
  # A Web Service for our Flask App
  - type: web
    name: bitwave
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    # Use the gevent-websocket worker for maximum stability in production
    startCommand: "gunicorn --worker-class geventwebsocket.gunicorn.workers.GeventWebSocketWorker -w 1 --bind 0.0.0.0:$PORT app:socketio"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.4
      - key: PYTHON
        value: 3.11.4
    # A Persistent Disk to store our downloads
    disks:
      - name: downloads
        mountPath: /opt/render/project/src/downloads
        sizeGB: 1
