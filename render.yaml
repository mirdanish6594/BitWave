services:
  # A Web Service for our Flask App
  - type: web
    name: bitwave
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn --worker-class gevent -w 1 --timeout 120 wsgi:app"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.4
    # Mount the disk to a safe, user-owned location
    disks:
      - name: storage
        mountPath: /opt/render/project/src/storage
        sizeGB: 1
