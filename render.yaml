services:
  # 1. The Redis database
  - type: redis
    name: redis-cache
    plan: free
    ipAllowList: []
    maxmemoryPolicy: allkeys-lru

  # 2. The Web Service (Flask App)
  - type: web
    name: bitwave
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    # This command tells Gunicorn to run the app defined in our wsgi.py file
    startCommand: "gunicorn wsgi:app"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.4
      - key: REDIS_URL
        fromService:
          type: redis
          name: redis-cache
          property: connectionString
      - key: RENDER_DISK_MOUNT_PATH
        value: /var/data/storage
    disks:
      - name: storage
        mountPath: /var/data/storage
        sizeGB: 1

  # 3. The Background Worker
  - type: worker
    name: downloader-worker
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python worker.py"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.4
      - key: REDIS_URL
        fromService:
          type: redis
          name: redis-cache
          property: connectionString
      - key: RENDER_DISK_MOUNT_PATH
        fromService:
          type: web
          name: bitwave
          property: diskPath
    disks:
      - name: storage
        fromService:
          type: web
          name: bitwave
          property: disk
