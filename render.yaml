services:
  # 1. The Redis database for queuing jobs and status messages
  - type: redis
    name: redis-cache
    plan: free
    ipAllowList: [] # Allow all services in the account to connect
    maxmemoryPolicy: allkeys-lru

  # 2. The Web Service (Flask App) for the user interface
  - type: web
    name: bitwave
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn --worker-class gevent -w 1 --timeout 120 app:socketio"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.4
      - key: REDIS_URL # This connects the web app to the Redis service
        fromService:
          type: redis
          name: redis-cache
          property: connectionString
    disks:
      - name: storage
        mountPath: /var/data
        sizeGB: 1

  # 3. The Background Worker to handle the actual downloads
  - type: worker
    name: downloader-worker
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python worker.py"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.4
      - key: REDIS_URL # This connects the worker to the Redis service
        fromService:
          type: redis
          name: redis-cache
          property: connectionString
    disks:
      - name: storage # The worker needs access to the same disk
        fromService:
          type: web
          name: bitwave
          property: disk
