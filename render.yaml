services:
  # A Web Service for our Flask App
  - type: web
    name: bitwave
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    # Use the new wsgi.py entry point for maximum stability
    startCommand: "gunicorn --worker-class gevent -w 1 wsgi:app"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.4
    # A Persistent Disk to store our downloads
    disks:
      - name: downloads
        mountPath: /opt/render/project/src/downloads
        sizeGB: 1
