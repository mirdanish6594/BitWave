services:
  # A Web Service for our Flask App
  - type: web
    name: bitwave
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    # Revert to the standard, more stable gevent worker
    startCommand: "gunicorn --worker-class gevent -w 1 --bind 0.0.0.0:$PORT app:socketio"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.4
    # A Persistent Disk to store our downloads
    disks:
      - name: downloads
        mountPath: /opt/render/project/src/downloads
        sizeGB: 1
